version: '3'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  test:
    desc: Run the Rust tests, including the Android runtime and session tests on Linux
    cmds:
      - cargo test -p slot-android --lib
      - cargo test -p slot-android --features runtime-tests --lib
      - cargo test -p slot-achievements -p slot-retro -p slot-store -p slot-power
      - cargo test -p slot-gfx --no-default-features --test konkr

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=ra_sync
    requires:
      vars: [FILTER]
    cmds:
      - cargo test -p slot-android --features runtime-tests --lib {{.FILTER}}

  test:tools:
    desc: Test the capture tools and report parsers
    cmds:
      - python3 -m unittest discover -s tools/emulation-lab -p 'test_*.py'
      - python3 -m unittest discover -s tools/retroarch-parity -p 'test_*.py'

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  apk:
    desc: Build the native library, the cores if missing, and a debug APK (needs the NDK)
    cmds:
      - bash scripts/build-konkr-android.sh
