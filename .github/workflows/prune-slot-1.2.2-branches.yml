name: Prune archived v1.2.2 experiment branches

# One-time maintenance, intentionally independent of release publishing.
# Runs only on an explicitly titled, GitHub-reviewed commit on main.
on:
  push:
    branches: [main]

jobs:
  prune:
    if: >-
      github.repository == 'Baggio94/slot-for-kpa' &&
      startsWith(github.event.head_commit.message, 'chore: prune obsolete slot v1.2.2 branches')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify published signed release and no open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag=konkr-v1.2.2
          tag_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
          test "$(gh api "repos/$repo/git/commits/$tag_sha" --jq '.verification.verified')" = "true" || {
            echo "::error::The stable release reference is not GitHub Verified."; exit 1;
          }
          gh api "repos/$repo/releases/tags/$tag" |
            jq -e '.draft == false and .prerelease == false and
              ([.assets[].name] | index("slot-for-konkr-1.2.2-arm64.apk") != null and
                index("SHA256SUMS.txt") != null)' >/dev/null || {
                  echo "::error::Stable APK and checksums are not publicly published."; exit 1;
                }
          open_count="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_count" = 0 || {
            echo "::error::There are open PRs; refusing to remove their possible heads."; exit 1;
          }
          echo "Verified release $tag at $tag_sha. No open PRs; prune gate passed."

      - name: Prune only approved obsolete v1.2.2 branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Explicit audited allowlist, not a glob. Never delete main or tags.
          branches=(
            beta/sleepmanager-status-api-v1
            beta/1.2.2-beta1-retry-drilldozer
            beta/1.2.2-beta2-zip
            beta/1.2.2-beta3-emulation-lab
            beta/1.2.2-beta4-av-cart-ui
            beta/1.2.2-beta5-pacing-lab
            beta/1.2.2-beta6-audio-lab
            beta/1.2.2-beta6-qa-harness
            beta/1.2.2-beta7-hybrid-lab
            beta/1.2.2-beta8-sync-lab
            beta/1.2.2-beta9-present-lab
            beta/1.2.2-beta10-early-pcm-lab
            beta/1.2.2-beta11-qa-hardening
            beta/1.2.2-beta12-clock-causality
            beta/1.2.2-beta12-recovery
            beta/1.2.2-beta13-jni-crash-fix
            beta/1.2.2-beta14-mgba-audio-debt-recovery
            beta/1.2.2-beta15-restore-input-fluidity
            beta/1.2.2-qa-automation
            beta/1.2.2-release-regression-tests
            hotfix/1.2.2-beta12-recovery
            qa/1.2.2-zip-save-regressions
            release/1.2.2-rc1-sleepmanager-status-v1
            release/1.2.2-verified-prep
            chore/prune-slot-1.2.2-branches
          )
          for branch in "${branches[@]}"; do
            if [[ "$branch" != beta/1.2.2-* &&
                  "$branch" != beta/sleepmanager-status-api-v1 &&
                  "$branch" != hotfix/1.2.2-* &&
                  "$branch" != qa/1.2.2-* &&
                  "$branch" != release/1.2.2-* &&
                  "$branch" != chore/prune-slot-1.2.2-branches ]]; then
              echo "::error::Unexpected branch in explicit allowlist: $branch"; exit 1
            fi
            if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$repo/git/refs/heads/$branch" --silent
              echo "Removed merged/archived branch: $branch"
            else
              echo "Already absent: $branch"
            fi
          done
          # Preserve the unrelated tools branch and main, as well as every tag.
          echo "v1.2.2 branch cleanup complete; main and all release tags untouched."
