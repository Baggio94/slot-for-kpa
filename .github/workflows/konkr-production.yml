name: slot. for KONKR ARM64

on:
  workflow_dispatch:
  push:
    branches: [main, 'extract/**', 'beta/**', 'release/**']
    tags: ['konkr-v*']

permissions:
  contents: read

jobs:
  arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          # GitHub hosted ubuntu includes Android SDK command-line tools.
          # setup-android@v3 currently tries to install removed "tools" package.
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          # Google SDK's CDN occasionally returns a corrupt/truncated NDK ZIP.
          # A fresh hosted runner cannot reuse a partial download, so retry
          # the pinned NDK instead of failing a healthy source checkout.
          for attempt in 1 2 3 4; do
            if "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" \
              && test -s "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties"; then
              echo "Verified Android NDK r27c installed (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android NDK 27.2 download failed after four attempts"
              exit 1
            fi
            echo "::warning::Transient SDK/NDK download error, retry $attempt of 4"
            sleep $((attempt * 5))
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          # Match rust-toolchain.toml (channel = "1.96") exactly.
          # "1.96.0" and "1.96" can install into DISTINCT rustup homes;
          # cargo reads the project's 1.96 override.
          toolchain: '1.96'
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test offline Emulation Lab telemetry parser
        run: python3 -m unittest discover -s tools/emulation-lab -p 'test_*.py' -v
      - name: Test F10 achievements coalesced wakeups and idle flush on Linux
        run: |
          set -euo pipefail
          cargo test -p slot-achievements --lib f10_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/f10-ra-tests.log"
          grep -Eq 'test result: ok\. 5 passed; 0 failed;' "$RUNNER_TEMP/f10-ra-tests.log"
      - name: Test opt-in RA CLOCK LAB pure scheduler on Linux
        run: |
          set -euo pipefail
          cargo test -p slot-android --lib ra_clock_lab_ -- --nocapture 2>&1 |
            tee "$RUNNER_TEMP/ra-clock-lab.log"
          grep -Eq 'test result: ok\. 6 passed; 0 failed;' "$RUNNER_TEMP/ra-clock-lab.log"
          grep -F 'frame_debt_ra_clock' crates/slot-android/src/runtime.rs
      - name: Test native RetroAchievements evaluator and offline queue
        run: cargo test -p slot-achievements -p slot-retro
      - name: Test KONKR 3:2 scaling
        run: cargo test -p slot-gfx --no-default-features --test konkr
      - name: Test full-width Slot onboarding prompts
        run: cargo test -p slot-ui --lib onboarding_tests
      - name: Test original Slot v1.7 PNG and cartridge graphics
        run: cargo test -p slot-ui --test cart_material --test upstream_v17_assets --test native_resolution --test insert_neighbour_motion --test mixed_shelf_parity --test chrome_crt_parity --test native_density
      - name: Export authentic Slot keycap graphics for Android Apps
        run: |
          cargo run --locked -p slot-ui --example export_apps_legend -- android/app/src/main/assets/apps_controls
          test -s android/app/src/main/assets/apps_controls/move.png
          test -s android/app/src/main/assets/apps_controls/open.png
          test -s android/app/src/main/assets/apps_controls/back.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('move', 'open', 'back'):
              data = (Path('android/app/src/main/assets/apps_controls') / f'{name}.png').read_bytes()
              assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10))
              width, height = struct.unpack('>II', data[16:24])
              # Drawn at the KONKR's 4/3 panel density: Slot's 24px band.
              assert width > 20 and height == 32, (name, width, height)
              print(f'Verified authentic Slot legend {name}: {width}x{height}')
          PY
      - name: Test beta10 offline SurfaceFlinger presentation histogram parser
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/emulation-lab -p 'test_surfaceflinger_timestats.py' -v
          grep -F 'glPacingCorrelation.record(' android/app/src/main/java/fyi/slot/konkr/MainActivity.kt
          grep -F 'class FramePacingCorrelationTest' android/app/src/test/java/fyi/slot/konkr/FramePacingCorrelationTest.kt
      - name: Test beta14 F8 nested end_setup GLES call phase collector on Linux
        run: |
          set -euo pipefail
          cargo test -p slot-android --lib f8_phase -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/f8-native-phases.log"
          grep -Eq 'test result: ok\. 8 passed; 0 failed;' "$RUNNER_TEMP/f8-native-phases.log"
          grep -F 'Native frame phases:' crates/slot-android/src/frame_phases.rs
          grep -F 'frame_phases.gpu_submit_us' crates/slot-android/src/runtime.rs
          grep -F 'frame_phases.submit_draw_us' crates/slot-android/src/runtime.rs
          grep -F 'frame_phases.submit_blit_us' crates/slot-android/src/runtime.rs
          grep -F 'frame_phases.end_setup_us' crates/slot-android/src/runtime.rs
          grep -F 'frame_phases.end_bind_us' crates/slot-android/src/runtime.rs
          grep -F 'frame_phases.end_clear_us' crates/slot-android/src/runtime.rs
          grep -F 'gl::BindFramebuffer(gl::FRAMEBUFFER, 0)' crates/slot-gfx/src/fbo.rs
          grep -F 'end_frame_profiled' crates/slot-gfx/src/fbo.rs
          grep -F 'last_step_timings' crates/slot-android/src/game.rs

      - name: Test F9 reused PCM FIFO order and bounded native JNI transfer on Linux
        run: |
          set -euo pipefail
          cargo test -p slot-android --lib audio_pcm::tests -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/f9-pcm-tests.log"
          grep -Eq 'test result: ok\. 8 passed; 0 failed;' "$RUNNER_TEMP/f9-pcm-tests.log"
      - name: Verify old allocating JNI audio reader is gone
        run: |
          set -euo pipefail
          grep -F 'external fun nativeReadAudioInto(samples: ShortArray): Int' android/app/src/main/java/fyi/slot/konkr/MainActivity.kt
          grep -F 'fn Java_fyi_slot_konkr_MainActivity_nativeReadAudioInto(' crates/slot-android/src/runtime/jni_exports.rs
          if grep -Fq 'external fun nativeReadAudio(): ShortArray' android/app/src/main/java/fyi/slot/konkr/MainActivity.kt; then
            echo '::error::Allocating audio JNI entrypoint restored'
            exit 1
          fi
          if grep -Fq 'fn Java_fyi_slot_konkr_MainActivity_nativeReadAudio(' crates/slot-android/src/runtime/jni_exports.rs; then
            echo '::error::Allocating native audio reader restored'
            exit 1
          fi
      - name: Test F7 async SRAM/RTC durability, ordering and failures on Linux
        run: |
          set -euo pipefail
          # GameSession itself is Android-only, but this exact disk worker
          # must be exercised on Ubuntu rather than merely compiled for ARM64.
          cargo test -p slot-android --lib battery_writer::tests -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/f7-battery-tests.log"
          grep -Eq 'test result: ok\. 6 passed; 0 failed;' "$RUNNER_TEMP/f7-battery-tests.log"
      - name: Test Android library and shelf selection
        run: cargo test -p slot-android --lib
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Validate pinned speculative-audio patch scripts
        run: python3 -m py_compile scripts/patch-mgba-speculative-audio.py scripts/patch-gpsp-speculative-audio.py scripts/patch-mgba-active-sram.py scripts/patch-gpsp-backend-diagnostic.py
      - name: Build mGBA arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-mgba-android.sh
      - name: Build gpSP arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gpsp-android.sh
      - name: Checkout official Slot revision required by Cart Studio
        uses: actions/checkout@v4
        with:
          repository: BrandonKowalski/slot
          ref: 34ac38031fd903eb2a0a0157f1dea4d3a5546195
          path: studio-upstream/slot

      - name: Stage original Studio with its pinned upstream Slot sources
        run: |
          set -euo pipefail
          cp -a third_party/slot-cart-studio studio-upstream/slot-cart-studio
          # Isolate the pinned upstream Cargo project from our parent workspace.
          # This edit affects the ephemeral CI copy only; vendored sources stay exact.
          printf '\n[workspace]\n' >> studio-upstream/slot-cart-studio/Cargo.toml
          test "$(tr -d '\r\n' < studio-upstream/slot-cart-studio/slot.ref)" = \
               "$(git -C studio-upstream/slot rev-parse HEAD)"
          node --test studio-upstream/slot-cart-studio/web/*.test.mjs

      - name: Install wasm-pack and target for original Studio
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build and package genuine Cart Studio HTML/JS/WASM in APK assets
        run: |
          set -euo pipefail
          (cd studio-upstream/slot-cart-studio && \
            wasm-pack build --release --target web --no-typescript --out-dir web/pkg)
          python3 scripts/package-konkr-cart-studio.py \
            --source . --built studio-upstream/slot-cart-studio/web
          test -s android/app/src/main/assets/studio/pkg/slot_cart_studio_bg.wasm

      - name: Test Android debug and KONKR release policies on JVM
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:testReleaseUnitTest
      - name: Assemble signed KONKR ARM64 release
        env:
          SLOT_KEYSTORE_BASE64: ${{ secrets.SLOT_KEYSTORE_BASE64 }}
          SLOT_SIGNING_STORE_PASSWORD: ${{ secrets.SLOT_SIGNING_STORE_PASSWORD }}
          SLOT_SIGNING_KEY_ALIAS: ${{ secrets.SLOT_SIGNING_KEY_ALIAS }}
          SLOT_SIGNING_KEY_PASSWORD: ${{ secrets.SLOT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SLOT_KEYSTORE_BASE64" || { echo "::error::Configure permanent signing secrets"; exit 1; }
          export SLOT_SIGNING_STORE_FILE="$RUNNER_TEMP/slot-konkr-signing.jks"
          (umask 077; printf '%s' "$SLOT_KEYSTORE_BASE64" | base64 -d > "$SLOT_SIGNING_STORE_FILE")
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-konkr-android.sh
          gradle --no-daemon -p android :app:assembleRelease
      - name: Verify every MainActivity JNI symbol is exported in shipped ARM64 binary
        run: |
          set -euo pipefail
          SO="$RUNNER_TEMP/libslot_android.so"
          unzip -p android/app/build/outputs/apk/release/app-release.apk \
            lib/arm64-v8a/libslot_android.so > "$SO"
          test -s "$SO"
          NDK_NM="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NDK_NM" -D --defined-only "$SO" > "$RUNNER_TEMP/slot-jni-exports.txt"
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("android/app/src/main/java/fyi/slot/konkr/MainActivity.kt").read_text()
          expected = set(re.findall(r"\bexternal\s+fun\s+([A-Za-z0-9_]+)\s*\(", source))
          nm_text = Path(__import__("os").environ["RUNNER_TEMP"], "slot-jni-exports.txt").read_text()
          exported = set(re.findall(r"\bJava_fyi_slot_konkr_MainActivity_([A-Za-z0-9_]+)\b", nm_text))
          assert len(expected) >= 50, f"Unexpected external declaration count: {len(expected)}"
          missing = sorted(expected - exported)
          if missing:
              raise SystemExit("Missing JNI exports in signed APK: " + ", ".join(missing))
          print(f"Verified {len(expected)} MainActivity JNI method exports in signed ARM64 APK")
          PY
      - name: Verify isolated Mac AVD Emulation Lab debug APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/mac-lab-badging.txt"
          grep -F "package: name='fyi.slot.konkr.diag' versionCode='176'" "$RUNNER_TEMP/mac-lab-badging.txt"
          grep -F "versionName='1.3.0-beta8-hd2-mac-lab'" "$RUNNER_TEMP/mac-lab-badging.txt"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"
          for core in slot_android mgba_libretro gpsp_libretro; do
            unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/lib${core}.so"
          done
          unzip -Z -1 "$APK" | grep -Fx 'assets/studio/pkg/slot_cart_studio_bg.wasm'
          if unzip -Z -1 "$APK" | grep -Eq '^lib/(x86_64|x86|armeabi-v7a)/'; then
            echo "::error::Lab APK must remain ARM64 for Apple Silicon AVD"; exit 1
          fi
          # The manifest must be side-by-side safe: own FileProvider authority.
          unzip -Z -1 "$APK" | grep -Fx 'AndroidManifest.xml'
          grep -F 'fyi.slot.konkr.diag' "$RUNNER_TEMP/mac-lab-badging.txt"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: slot-for-konkr-1.2.3-mac-avd-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify signed ARM64 APK and upgrade compatibility
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/konkr-badging.txt"
          grep -F "package: name='fyi.slot.konkr' versionCode='176'" "$RUNNER_TEMP/konkr-badging.txt"
          grep -F "versionName='1.3.0-beta8-hd2'" "$RUNNER_TEMP/konkr-badging.txt"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" |
            grep -Fi '4f42b8f0ac98f6a0102804ab51020ea0e7e2de7685c6ce09400a744de0b0fa2f'
          for core in slot_android mgba_libretro gpsp_libretro; do
            unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/lib${core}.so"
          done
          if unzip -Z -1 "$APK" | grep -Eq '^lib/(x86_64|x86|armeabi-v7a)/'; then
            echo "::error::Non-KONKR ABI included in production APK"; exit 1
          fi
          unzip -Z -1 "$APK" | grep -Fx 'assets/studio/pkg/slot_cart_studio_bg.wasm'
          # F11: prevent a future signed build from silently omitting either
          # mandatory upstream safety patch or selecting a different core.
          python3 - "$APK" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              mgba = json.loads(archive.read("assets/core-build-mgba.json"))
              gpsp = json.loads(archive.read("assets/core-build-gpsp.json"))
          assert mgba["revision"] == "7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6"
          assert gpsp["revision"] == "5819380c2ffb0900219d700a382ee68c464ebb99"
          assert {"flash-bank-survives-mask.patch",
                  "gb-dmg-palette-follows-option.patch",
                  "543a19758-mbc2-sram-bank.patch"} <= set(mgba["patches"])
          assert "patch-mgba-active-sram.py" in mgba["patches"]
          assert "aw-session-reset.patch" in gpsp["patches"]
          assert "patch-gpsp-backend-diagnostic.py" in gpsp["patches"]
          assert gpsp["native_aw_harness"] == "asan-passed"
          print("Verified shipping native-core provenance and critical patch list")
          PY
          # The signed KONKR APK must not contain AVD keyboard detection or
          # isolated Multiplayer Lab storage behavior from src/debug.
          unzip -Z -1 "$APK" | grep -Eq '^classes([0-9]+)?[.]dex$'
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings -a |
                grep -E 'sdk_gphone|ranchu|goldfish|fyi[.]slot[.]konkr[.]lab|Multiplayer Lab:'; then
              echo "::error::Found AVD / Multiplayer Lab test code in release DEX"
              exit 1
            fi
          done < <(unzip -Z -1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$')
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: slot-for-konkr-1.2.3-arm64-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish:
    # Only the explicit release merge into main publishes a stable release.
    # No beta, branch CI, manual run or tag push can publish this release.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: slot. for KONKR Pocket Advance v1.2.3')
    needs: arm64-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: slot-for-konkr-1.2.3-arm64-signed
          path: release-assets

      - name: Validate, create GitHub-verified release commit, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=konkr-v1.2.3
          file=slot-for-konkr-1.2.3-arm64.apk
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s release-assets/app-release.apk
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing to overwrite"
            exit 1
          fi
          mv release-assets/app-release.apk "release-assets/$file"
          (cd release-assets && sha256sum "$file" > SHA256SUMS.txt)
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

          # As in v1.1.0: create a no-source-change GitHub-signed commit,
          # then verify GitHub's signature BEFORE tagging or publishing.
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA" || {
            echo "::error::main moved during release; abort"; exit 1;
          }
          tree="$(git rev-parse 'HEAD^{tree}')"
          jq -nc --arg tree "$tree" --arg parent "$GITHUB_SHA" \
            --arg message "chore: signed v1.2.3 release reference" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - \
            > "$RUNNER_TEMP/signed-commit.json"
          verified="$(jq -r '.verification.verified' "$RUNNER_TEMP/signed-commit.json")"
          sha="$(jq -r '.sha' "$RUNNER_TEMP/signed-commit.json")"
          test "$verified" = true || {
            echo "::error::GitHub did not verify release commit; release not published"
            exit 1
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '.verification.verified')" = true
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
            -f sha="$sha" -F force=false >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$sha"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$sha"

          gh release create "$tag" "release-assets/$file" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "slot. for KONKR Pocket Advance v1.2.3" \
            --notes-file RELEASE-NOTES.md

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json name,isDraft,isPrerelease,tagName,assets,url \
            | tee "$RUNNER_TEMP/release-result.json"
          jq -e --arg tag "$tag" --arg apk "$file" \
            '.tagName == $tag and (.isDraft == false) and (.isPrerelease == false) and
             ([.assets[].name] | index($apk) != null and index("SHA256SUMS.txt") != null)' \
            "$RUNNER_TEMP/release-result.json"
          mkdir -p "$RUNNER_TEMP/check-published-assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/check-published-assets"
          (cd "$RUNNER_TEMP/check-published-assets" && sha256sum -c SHA256SUMS.txt)
          echo "Published stable verified v1.2.3 tag at $sha"
